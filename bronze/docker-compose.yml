# Couche Bronze : SeaweedFS (stockage compatible S3) + Apache NiFi (ingestion).
# Les secrets et les chemins viennent du fichier .env (voir .env.example).

# Nom du projet Docker : il préfixe les conteneurs (bronze-nifi-1...) et les volumes (bronze_seaweed_data...).
# Le figer évite que les volumes changent de nom (et paraissent vides) si le dossier est renommé.
name: bronze

# Fichier de clés S3 fabriqué à partir du .env, puis monté dans le conteneur SeaweedFS.
configs:
  s3_config:
    content: |
      {"identities":[{"name":"chu","credentials":[{"accessKey":"${S3_ACCESS_KEY}","secretKey":"${S3_SECRET_KEY}"}],"actions":["Admin","Read","Write","List","Tagging"]}]}

services:
  seaweedfs:
    image: chrislusf/seaweedfs:4.51
    command: server -dir=/data -volume.max=0 -master.volumeSizeLimitMB=1024 -filer -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Définir S3_ACCESS_KEY dans le fichier .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Définir S3_SECRET_KEY dans le fichier .env}
    configs:
      - source: s3_config
        target: /etc/seaweedfs/s3.json
    volumes:
      - seaweed_data:/data
    ports:
      - "127.0.0.1:8333:8333"   # API S3
      - "127.0.0.1:8888:8888"   # explorateur de fichiers

  nifi:
    image: apache/nifi:2.12.0
    environment:
      SINGLE_USER_CREDENTIALS_USERNAME: ${NIFI_USER:?Définir NIFI_USER dans le fichier .env}
      SINGLE_USER_CREDENTIALS_PASSWORD: ${NIFI_PASSWORD:?Définir NIFI_PASSWORD dans le fichier .env}
      NIFI_WEB_HTTPS_PORT: "8443"
      NIFI_JVM_HEAP_INIT: 1g
      NIFI_JVM_HEAP_MAX: 2g
    volumes:
      - nifi_conf:/opt/nifi/nifi-current/conf
      - nifi_state:/opt/nifi/nifi-current/state
      - type: bind
        source: ${DATA_DIR:?Définir DATA_DIR dans le fichier .env}/Hospitalisation
        target: /data/hospitalisation
        read_only: true
      - type: bind
        source: ${DATA_DIR}/Etablissement de SANTE
        target: /data/etablissements
        read_only: true
      - ./nifi-drivers:/opt/nifi/drivers:ro
    ports:
      - "127.0.0.1:8443:8443"
  sftp:
    image: atmoz/sftp:alpine
    command: ["${SFTP_USER:?Définir SFTP_USER dans le fichier .env}:${SFTP_PASSWORD:?Définir SFTP_PASSWORD dans le fichier .env}:1001:100"]
    volumes:
      - type: bind
        source: ${DATA_DIR}/DECES EN FRANCE
        target: /home/${SFTP_USER}/deces
        read_only: true
      - type: bind
        source: ${DATA_DIR}/Satisfaction
        target: /home/${SFTP_USER}/satisfaction
        read_only: true
    ports:
      - "127.0.0.1:2222:22"

  pg-source:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_PASSWORD: ${PG_SUPER_PASSWORD:?Définir PG_SUPER_PASSWORD dans le fichier .env}
      POSTGRES_DB: chu_source
    volumes:
      - pg_source_data:/var/lib/postgresql
      - type: bind
        source: ${DATA_DIR}/BDD PostgreSQL
        target: /dump
        read_only: true
    ports:
      - "127.0.0.1:15433:5432"

volumes:
  seaweed_data:
  nifi_conf:
  nifi_state:
  pg_source_data:
